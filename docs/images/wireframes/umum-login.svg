<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Wireframe halaman masuk Medika Cuti</title>
  <desc id="description">Rancangan halaman masuk responsif dengan identitas aplikasi, formulir NIK dan kata sandi, pilihan ingat saya, tombol masuk, informasi koneksi, dan tombol tema.</desc>
  <defs>
    <style>
      .canvas { fill: #f8fafc; }
      .surface { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .muted { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.5; }
      .accent { fill: #d1fae5; stroke: #059669; stroke-width: 2; }
      .primary { fill: #059669; }
      .line { stroke: #64748b; stroke-width: 2; fill: none; }
      .label { fill: #0f172a; font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; }
      .text { fill: #334155; font-family: Arial, sans-serif; font-size: 15px; }
      .small { fill: #64748b; font-family: Arial, sans-serif; font-size: 13px; }
      .white { fill: #ffffff; font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; }
      .note { fill: #047857; font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <rect class="canvas" width="1200" height="760"/>
  <text class="label" x="50" y="54">UI-AUT-01 — Halaman Masuk</text>
  <text class="small" x="50" y="80">Wireframe desktop; susunan tetap satu kolom pada perangkat seluler.</text>

  <rect class="surface" x="270" y="105" width="660" height="600" rx="22"/>

  <rect class="primary" x="464" y="135" width="54" height="54" rx="14"/>
  <text class="white" x="480" y="168">MA</text>
  <text class="label" x="534" y="155">Medika Cuti</text>
  <text class="small" x="534" y="178">Klinik Utama Medika Antapani</text>

  <rect class="surface" x="355" y="215" width="490" height="405" rx="20"/>
  <text class="note" x="502" y="257">SELAMAT DATANG KEMBALI</text>
  <text class="label" x="493" y="290">Masuk ke akun Anda</text>
  <text class="small" x="439" y="316">Gunakan NIK dan kata sandi dari Admin HR.</text>

  <text class="text" x="400" y="363">NIK</text>
  <rect class="muted" x="400" y="377" width="400" height="48" rx="10"/>
  <circle class="line" cx="423" cy="397" r="7"/>
  <path class="line" d="M411 416c2-9 22-9 24 0"/>
  <text class="small" x="449" y="407">Contoh: PGW-000004</text>

  <text class="text" x="400" y="462">Kata sandi</text>
  <rect class="muted" x="400" y="476" width="400" height="48" rx="10"/>
  <rect class="line" x="414" y="493" width="18" height="15" rx="3"/>
  <path class="line" d="M418 493v-5a5 5 0 0 1 10 0v5"/>
  <text class="small" x="449" y="506">Masukkan kata sandi</text>
  <path class="line" d="M765 500s7-8 15 0c-8 8-15 0-15 0Z"/>

  <rect class="surface" x="400" y="545" width="18" height="18" rx="3"/>
  <text class="small" x="430" y="559">Ingat saya di perangkat ini</text>

  <rect class="primary" x="400" y="578" width="400" height="48" rx="10"/>
  <text class="white" x="574" y="608">Masuk</text>

  <text class="small" x="355" y="663">Transaksi memerlukan koneksi internet.</text>
  <rect class="accent" x="743" y="642" width="102" height="32" rx="9"/>
  <text class="note" x="771" y="663">Tema</text>

  <path class="line" d="M270 242H155"/>
  <circle class="accent" cx="135" cy="242" r="18"/>
  <text class="note" x="131" y="247">1</text>
  <text class="text" x="50" y="287">Identitas aplikasi</text>

  <path class="line" d="M845 400h130"/>
  <circle class="accent" cx="995" cy="400" r="18"/>
  <text class="note" x="991" y="405">2</text>
  <text class="text" x="970" y="445">Form autentikasi</text>

  <path class="line" d="M845 658h130"/>
  <circle class="accent" cx="995" cy="658" r="18"/>
  <text class="note" x="991" y="663">3</text>
  <text class="text" x="970" y="703">Status koneksi &amp; tema</text>
</svg>
