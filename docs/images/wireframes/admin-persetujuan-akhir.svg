<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
<title id="title">Wireframe persetujuan akhir Admin HR</title><desc id="description">Antrean persetujuan akhir berisi data pengajuan, informasi keputusan Atasan, catatan, serta tombol tolak dan setujui.</desc><defs><style>.b{fill:#f8fafc}.f{fill:#fff;stroke:#64748b;stroke-width:2}.s{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.m{fill:#e2e8f0;stroke:#94a3b8;stroke-width:1.5}.a{fill:#d1fae5;stroke:#059669;stroke-width:2}.q{fill:#fef3c7;stroke:#f59e0b;stroke-width:1.5}.i{fill:#dbeafe;stroke:#3b82f6;stroke-width:1.5}.d{fill:#fff;stroke:#ef4444;stroke-width:1.5}.p{fill:#059669}.h{fill:#0f172a;font:700 18px Arial}.t{fill:#334155;font:14px Arial}.x{fill:#64748b;font:12px Arial}.n{fill:#047857;font:700 13px Arial}.r{fill:#b91c1c;font:700 14px Arial}.w{fill:#fff;font:700 14px Arial}</style></defs>
<rect class="b" width="1200" height="720"/><text class="h" x="50" y="54">UI-HR-02 &amp; UI-HR-03 — Persetujuan Akhir</text><text class="x" x="50" y="80">Pengajuan yang telah disetujui Atasan atau diajukan langsung oleh Atasan diproses oleh Admin HR.</text><rect class="f" x="90" y="110" width="1020" height="560" rx="16"/><text class="n" x="125" y="150">CUTI KARYAWAN</text><text class="h" x="125" y="184">Persetujuan Akhir</text><text class="x" x="125" y="208">Tinjau data dan riwayat sebelum memberikan keputusan akhir.</text>
<rect class="s" x="125" y="240" width="950" height="375" rx="14"/><line x1="725" y1="240" x2="725" y2="615" stroke="#cbd5e1" stroke-width="1.5"/><text class="n" x="155" y="280">CUTI-2026-000015</text><text class="h" x="155" y="314">Budi Santoso</text><text class="x" x="155" y="338">Karyawan · Pelayanan Medis</text><rect class="q" x="545" y="265" width="145" height="34" rx="17"/><text x="574" y="287" fill="#92400e" font-family="Arial" font-size="12" font-weight="700">Menunggu HR</text><rect class="m" x="155" y="365" width="535" height="70" rx="10"/><text class="x" x="175" y="392">TANGGAL CUTI</text><text class="h" x="175" y="420">20 Oktober 2026</text><text class="x" x="155" y="472">ALASAN</text><text class="t" x="155" y="497">Keperluan keluarga.</text><rect class="i" x="155" y="523" width="535" height="55" rx="10"/><text x="175" y="556" fill="#1d4ed8" font-family="Arial" font-size="13">Disetujui Atasan: Nama Atasan · Catatan keputusan</text>
<rect class="s" x="755" y="265" width="290" height="295" rx="11"/><text class="h" x="780" y="305">Catatan keputusan</text><text class="x" x="780" y="329">Wajib diisi jika ditolak.</text><rect class="m" x="780" y="350" width="240" height="115" rx="9"/><text class="x" x="798" y="376">Tuliskan catatan...</text><rect class="d" x="780" y="488" width="112" height="48" rx="9"/><text class="r" x="818" y="517">Tolak</text><rect class="p" x="908" y="488" width="112" height="48" rx="9"/><text class="w" x="933" y="517">Setujui</text><text class="x" x="125" y="646">Keadaan kosong: “Tidak ada pengajuan yang menunggu.”</text>
</svg>
