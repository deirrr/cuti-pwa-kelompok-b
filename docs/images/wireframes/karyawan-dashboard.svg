<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Wireframe dashboard Karyawan dan Atasan</title>
  <desc id="description">Dashboard menampilkan sapaan, NIK, bagian organisasi, jatah cuti, pintasan Cuti Saya, dan pintasan Persetujuan Staff khusus Atasan.</desc>
  <defs><style>
    .bg{fill:#f8fafc}.frame{fill:#fff;stroke:#64748b;stroke-width:2}.surface{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.muted{fill:#e2e8f0;stroke:#94a3b8;stroke-width:1.5}.accent{fill:#d1fae5;stroke:#059669;stroke-width:2}.primary{fill:#059669}.dash{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7}.h{fill:#0f172a;font:700 18px Arial}.t{fill:#334155;font:14px Arial}.s{fill:#64748b;font:12px Arial}.n{fill:#047857;font:700 13px Arial}.w{fill:#fff;font:700 14px Arial}
  </style></defs>
  <rect class="bg" width="1200" height="760"/><text class="h" x="50" y="54">UI-KAR-01 — Dashboard Karyawan</text><text class="s" x="50" y="80">Konten menyesuaikan peran; kartu Persetujuan Staff hanya muncul untuk Atasan.</text>
  <text class="h" x="50" y="122">Desktop</text><rect class="frame" x="50" y="140" width="720" height="560" rx="14"/>
  <rect class="surface" x="50" y="140" width="720" height="74" rx="14"/><rect class="primary" x="75" y="157" width="40" height="40" rx="9"/><text class="w" x="86" y="182">MA</text><text class="t" x="128" y="174">Medika Cuti</text><text class="s" x="128" y="193">Karyawan</text><rect class="accent" x="500" y="158" width="93" height="38" rx="9"/><text class="n" x="517" y="182">Cuti Saya</text><circle class="surface" cx="625" cy="177" r="18"/><rect class="surface" x="654" y="158" width="88" height="38" rx="9"/><text class="t" x="676" y="182">Keluar</text>
  <text class="n" x="82" y="256">DASHBOARD KARYAWAN</text><text class="h" x="82" y="290">Halo, Nama Karyawan</text><text class="s" x="82" y="315">Ajukan cuti dan pantau proses persetujuannya dalam satu tempat.</text>
  <rect class="surface" x="82" y="345" width="200" height="92" rx="12"/><text class="s" x="102" y="373">NIK</text><text class="h" x="102" y="405">PGW-000004</text>
  <rect class="surface" x="300" y="345" width="200" height="92" rx="12"/><text class="s" x="320" y="373">Bagian organisasi</text><text class="h" x="320" y="405">Pelayanan</text>
  <rect class="surface" x="518" y="345" width="220" height="92" rx="12"/><text class="s" x="538" y="373">Jatah cuti</text><text class="h" x="538" y="405">12 hari</text>
  <rect class="primary" x="82" y="462" width="318" height="182" rx="14"/><rect x="102" y="485" width="40" height="40" rx="10" fill="#fff" opacity=".2"/><text class="w" x="106" y="511">CUTI</text><text class="w" x="102" y="555">Cuti Saya</text><text x="102" y="582" fill="#d1fae5" font-family="Arial" font-size="13">Buat dan lihat riwayat pengajuan.</text>
  <rect class="surface" x="420" y="462" width="318" height="182" rx="14"/><rect class="accent" x="440" y="485" width="40" height="40" rx="10"/><text class="n" x="447" y="510">OK</text><text class="h" x="440" y="555">Persetujuan Staff</text><text class="s" x="440" y="582">Khusus Atasan untuk meninjau pengajuan.</text>
  <text class="h" x="835" y="122">Ponsel</text><rect class="frame" x="835" y="140" width="315" height="560" rx="24"/><rect class="surface" x="835" y="140" width="315" height="72" rx="24"/><rect class="primary" x="855" y="157" width="38" height="38" rx="9"/><text class="w" x="865" y="181">MA</text><text class="t" x="905" y="175">Medika Cuti</text><text class="s" x="905" y="193">Karyawan</text><circle class="surface" cx="1118" cy="176" r="18"/>
  <text class="n" x="857" y="252">DASHBOARD</text><text class="h" x="857" y="280">Halo, Nama Karyawan</text><rect class="surface" x="857" y="304" width="271" height="62" rx="10"/><text class="s" x="873" y="329">NIK</text><text class="t" x="873" y="350">PGW-000004</text><rect class="surface" x="857" y="378" width="271" height="62" rx="10"/><text class="s" x="873" y="403">Bagian organisasi</text><text class="t" x="873" y="424">Pelayanan</text><rect class="surface" x="857" y="452" width="271" height="62" rx="10"/><text class="s" x="873" y="477">Jatah cuti</text><text class="t" x="873" y="498">12 hari</text><rect class="primary" x="857" y="530" width="271" height="67" rx="11"/><text class="w" x="875" y="570">Cuti Saya</text><rect class="surface" x="857" y="609" width="271" height="67" rx="11"/><text class="h" x="875" y="649">Persetujuan Staff</text>
</svg>
