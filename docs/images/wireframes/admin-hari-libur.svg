<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
<title id="title">Wireframe pengelolaan hari libur nasional</title><desc id="description">Daftar hari libur dengan filter tahun, status, aksi, dan formulir tanggal, nama, serta status aktif.</desc><defs><style>.b{fill:#f8fafc}.f{fill:#fff;stroke:#64748b;stroke-width:2}.s{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.m{fill:#e2e8f0;stroke:#94a3b8;stroke-width:1.5}.a{fill:#d1fae5;stroke:#059669;stroke-width:2}.p{fill:#059669}.h{fill:#0f172a;font:700 18px Arial}.t{fill:#334155;font:14px Arial}.x{fill:#64748b;font:12px Arial}.n{fill:#047857;font:700 13px Arial}.r{fill:#b91c1c;font:700 13px Arial}.w{fill:#fff;font:700 14px Arial}</style></defs><rect class="b" width="1200" height="650"/><text class="h" x="50" y="54">UI-HR-07 — Hari Libur Nasional</text><text class="x" x="50" y="80">Tanggal aktif otomatis dinonaktifkan pada kalender pengajuan cuti.</text><rect class="f" x="50" y="110" width="1100" height="490" rx="16"/><text class="n" x="80" y="150">PENGATURAN CUTI</text><text class="h" x="80" y="184">Hari Libur Nasional</text><rect class="p" x="965" y="144" width="155" height="42" rx="9"/><text class="w" x="983" y="170">Tambah Hari Libur</text><rect class="s" x="80" y="220" width="670" height="325" rx="13"/><text class="h" x="105" y="258">Daftar Hari Libur</text><text class="x" x="105" y="280">Menampilkan hari libur nasional tahun 2026.</text><rect class="m" x="550" y="240" width="90" height="40" rx="8"/><text class="t" x="572" y="265">2026</text><rect x="650" y="240" width="75" height="40" rx="8" fill="#0f172a"/><text class="w" x="661" y="265">Tampil</text><rect class="m" x="80" y="300" width="670" height="45"/><text class="x" x="105" y="328">TANGGAL</text><text class="x" x="250" y="328">NAMA HARI LIBUR</text><text class="x" x="485" y="328">STATUS</text><text class="x" x="615" y="328">AKSI</text><text class="t" x="105" y="380">25 Des 2026</text><text class="t" x="250" y="380">Hari Raya Natal</text><rect class="a" x="480" y="358" width="78" height="32" rx="16"/><text class="n" x="499" y="379">Aktif</text><text class="n" x="615" y="380">Ubah</text><text class="r" x="675" y="380">Hapus</text>
<rect class="s" x="775" y="220" width="345" height="325" rx="13"/><text class="h" x="800" y="258">Informasi Hari Libur</text><text class="t" x="800" y="305">Tanggal *</text><rect class="m" x="800" y="317" width="295" height="42" rx="8"/><text class="t" x="800" y="395">Nama hari libur *</text><rect class="m" x="800" y="407" width="295" height="42" rx="8"/><rect class="a" x="800" y="468" width="295" height="42" rx="9"/><text class="n" x="825" y="494">☑ Hari libur aktif</text><rect class="p" x="990" y="525" width="105" height="40" rx="8"/><text class="w" x="1011" y="550">Simpan</text>
