<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Wireframe detail pengajuan cuti</title><desc id="description">Rancangan lanjutan halaman detail yang menampilkan identitas pengajuan, tanggal, alasan, status, riwayat persetujuan, dan tindakan yang diizinkan.</desc>
  <defs><style>.bg{fill:#f8fafc}.frame{fill:#fff;stroke:#64748b;stroke-width:2}.surface{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.muted{fill:#e2e8f0;stroke:#94a3b8;stroke-width:1.5}.accent{fill:#d1fae5;stroke:#059669;stroke-width:2}.warn{fill:#fef3c7;stroke:#f59e0b;stroke-width:1.5}.line{stroke:#94a3b8;stroke-width:2}.h{fill:#0f172a;font:700 18px Arial}.t{fill:#334155;font:14px Arial}.s{fill:#64748b;font:12px Arial}.n{fill:#047857;font:700 13px Arial}</style></defs>
  <rect class="bg" width="1200" height="700"/><text class="h" x="50" y="54">UI-KAR-04 — Detail Pengajuan Saya</text><text class="s" x="50" y="80">Rancangan lanjutan; halaman detail tersendiri belum tersedia pada implementasi saat ini.</text>
  <rect class="frame" x="170" y="110" width="860" height="535" rx="16"/><text class="s" x="205" y="150">CUTI SAYA / DETAIL</text><text class="h" x="205" y="184">CUTI-2026-000001</text><rect class="warn" x="820" y="150" width="170" height="38" rx="19"/><text x="849" y="174" fill="#92400e" font-family="Arial" font-size="13" font-weight="700">Menunggu Admin HR</text>
  <rect class="surface" x="205" y="215" width="790" height="155" rx="12"/><text class="s" x="230" y="250">TANGGAL CUTI</text><text class="h" x="230" y="278">20 Oktober 2026</text><text class="s" x="520" y="250">JUMLAH HARI</text><text class="h" x="520" y="278">1 hari</text><text class="s" x="230" y="320">ALASAN</text><text class="t" x="230" y="347">Keperluan keluarga.</text>
  <text class="h" x="205" y="415">Riwayat Persetujuan</text><line class="line" x1="236" y1="446" x2="236" y2="555"/><circle class="accent" cx="236" cy="460" r="11"/><text class="t" x="266" y="458">Dikirim oleh Karyawan</text><text class="s" x="266" y="478">17 Oktober 2026, 08.30</text><circle class="accent" cx="236" cy="520" r="11"/><text class="t" x="266" y="518">Disetujui Atasan</text><text class="s" x="266" y="538">17 Oktober 2026, 10.15 · Catatan keputusan</text><circle class="muted" cx="236" cy="575" r="11"/><text class="t" x="266" y="579">Menunggu keputusan Admin HR</text>
  <rect class="surface" x="760" y="565" width="92" height="42" rx="9"/><text class="t" x="786" y="591">Ubah</text><rect x="865" y="565" width="130" height="42" rx="9" fill="#fff" stroke="#ef4444" stroke-width="1.5"/><text x="889" y="591" fill="#b91c1c" font-family="Arial" font-size="14">Batalkan</text>
</svg>
