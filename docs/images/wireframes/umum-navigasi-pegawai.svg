<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Wireframe navigasi Karyawan dan Atasan</title>
  <desc id="description">Perbandingan navigasi pengguna pada desktop dan perangkat seluler, berisi identitas aplikasi, menu Cuti Saya, menu Persetujuan Staff untuk Atasan, tombol tema, dan keluar.</desc>
  <defs>
    <style>
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .surface { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .muted { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.5; }
      .accent { fill: #d1fae5; stroke: #059669; stroke-width: 2; }
      .primary { fill: #059669; }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 7; }
      .label { fill: #0f172a; font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; }
      .text { fill: #334155; font-family: Arial, sans-serif; font-size: 14px; }
      .small { fill: #64748b; font-family: Arial, sans-serif; font-size: 12px; }
      .white { fill: #ffffff; font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; }
      .note { fill: #047857; font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <rect class="canvas" width="1200" height="760"/>
  <text class="label" x="50" y="54">Navigasi Utama — Karyawan dan Atasan</text>
  <text class="small" x="50" y="80">Menu Persetujuan Staff hanya ditampilkan kepada pengguna dengan peran Atasan.</text>

  <text class="label" x="50" y="125">Desktop</text>
  <rect class="frame" x="50" y="145" width="700" height="520" rx="14"/>
  <rect class="surface" x="50" y="145" width="700" height="88" rx="14"/>
  <rect class="primary" x="75" y="169" width="42" height="42" rx="10"/>
  <text class="white" x="87" y="195">MA</text>
  <text class="label" x="130" y="184">Medika Cuti</text>
  <text class="small" x="130" y="207">Karyawan / Atasan</text>

  <rect class="accent" x="345" y="169" width="100" height="42" rx="9"/>
  <text class="note" x="363" y="195">Cuti Saya</text>
  <rect class="surface" x="455" y="169" width="140" height="42" rx="9"/>
  <text class="text" x="469" y="195">Persetujuan Staff</text>
  <circle class="surface" cx="625" cy="190" r="20"/>
  <path d="M620 181a10 10 0 1 0 12 14 9 9 0 0 1-12-14Z" fill="#64748b"/>
  <rect class="surface" x="655" y="169" width="70" height="42" rx="9"/>
  <text class="text" x="669" y="195">Keluar</text>

  <text class="label" x="85" y="285">Area Konten Halaman</text>
  <rect class="dash" x="85" y="310" width="630" height="315" rx="14"/>
  <rect class="muted" x="115" y="345" width="250" height="26" rx="6"/>
  <rect class="muted" x="115" y="391" width="570" height="90" rx="10"/>
  <rect class="muted" x="115" y="502" width="275" height="90" rx="10"/>
  <rect class="muted" x="410" y="502" width="275" height="90" rx="10"/>

  <text class="label" x="820" y="125">Ponsel</text>
  <rect class="frame" x="820" y="145" width="330" height="520" rx="24"/>
  <rect class="surface" x="820" y="145" width="330" height="82" rx="24"/>
  <rect class="primary" x="842" y="166" width="40" height="40" rx="9"/>
  <text class="white" x="853" y="191">MA</text>
  <text class="text" x="894" y="181">Medika Cuti</text>
  <text class="small" x="894" y="201">Atasan</text>
  <circle class="surface" cx="1075" cy="186" r="19"/>
  <rect class="surface" x="1104" y="167" width="29" height="38" rx="8"/>
  <path d="M1111 186h15M1119 178l7 8-7 8" fill="none" stroke="#64748b" stroke-width="2"/>

  <rect class="surface" x="820" y="227" width="330" height="64"/>
  <rect class="accent" x="842" y="238" width="105" height="42" rx="9"/>
  <text class="note" x="861" y="264">Cuti Saya</text>
  <rect class="surface" x="957" y="238" width="165" height="42" rx="9"/>
  <text class="text" x="971" y="264">Persetujuan Staff</text>

  <text class="label" x="842" y="340">Area Konten</text>
  <rect class="dash" x="842" y="360" width="286" height="270" rx="12"/>
  <rect class="muted" x="862" y="390" width="180" height="22" rx="5"/>
  <rect class="muted" x="862" y="434" width="246" height="72" rx="9"/>
  <rect class="muted" x="862" y="526" width="246" height="72" rx="9"/>

  <rect class="accent" x="50" y="695" width="20" height="20" rx="5"/>
  <text class="text" x="82" y="710">Menu aktif</text>
  <rect class="surface" x="180" y="695" width="20" height="20" rx="5"/>
  <text class="text" x="212" y="710">Menu sesuai peran</text>
  <rect class="muted" x="390" y="695" width="20" height="20" rx="5"/>
  <text class="text" x="422" y="710">Konten halaman</text>
</svg>
