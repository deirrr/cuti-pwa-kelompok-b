<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Wireframe halaman Cuti Saya</title><desc id="description">Halaman berisi saldo tersedia, filter tahun dan status, serta riwayat pengajuan berbentuk tabel pada desktop dan kartu pada ponsel.</desc>
