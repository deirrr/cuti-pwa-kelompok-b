<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Wireframe formulir pengajuan cuti</title><desc id="description">Form pengajuan cuti dengan kalender, penghitung tanggal, ketentuan tanggal, alasan, serta tombol batal dan kirim.</desc>
  <defs><style>.bg{fill:#f8fafc}.frame{fill:#fff;stroke:#64748b;stroke-width:2}.surface{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.muted{fill:#e2e8f0;stroke:#94a3b8;stroke-width:1.5}.accent{fill:#d1fae5;stroke:#059669;stroke-width:2}.primary{fill:#059669}.disabled{fill:#fee2e2;stroke:#fca5a5;stroke-width:1}.h{fill:#0f172a;font:700 18px Arial}.t{fill:#334155;font:14px Arial}.s{fill:#64748b;font:12px Arial}.n{fill:#047857;font:700 13px Arial}.w{fill:#fff;font:700 14px Arial}</style></defs>
  <rect class="bg" width="1200" height="800"/><text class="h" x="50" y="54">UI-KAR-02 — Form Pengajuan Cuti</text><text class="s" x="50" y="80">Form yang sama dipakai untuk pengajuan baru dan perubahan; mode ubah membatasi pilihan menjadi satu tanggal.</text>
  <rect class="frame" x="50" y="110" width="1100" height="640" rx="16"/><text class="n" x="85" y="150">CUTI SAYA / PENGAJUAN BARU</text><text class="h" x="85" y="184">Ajukan Cuti Tahunan</text><text class="s" x="85" y="209">Saldo yang dapat diajukan tahun ini: 10 hari.</text>
  <rect class="surface" x="85" y="235" width="1030" height="470" rx="14"/><text class="h" x="120" y="278">Tanggal cuti *</text><rect class="accent" x="535" y="256" width="95" height="34" rx="17"/><text class="n" x="554" y="278">2 tanggal</text>
  <rect class="surface" x="120" y="305" width="510" height="250" rx="12"/><rect class="muted" x="120" y="305" width="510" height="48" rx="12"/><text class="h" x="325" y="335">Oktober 2026</text><text class="h" x="145" y="335">‹</text><text class="h" x="598" y="335">›</text>
  <text class="s" x="147" y="382">MIN</text><text class="s" x="215" y="382">SEN</text><text class="s" x="283" y="382">SEL</text><text class="s" x="351" y="382">RAB</text><text class="s" x="419" y="382">KAM</text><text class="s" x="487" y="382">JUM</text><text class="s" x="555" y="382">SAB</text>
  <g class="t"><text x="151" y="420">18</text><text x="219" y="420">19</text><text x="287" y="420">20</text><text x="355" y="420">21</text><text x="423" y="420">22</text><text x="491" y="420">23</text><text x="559" y="420">24</text><text x="151" y="468">25</text><text x="219" y="468">26</text><text x="287" y="468">27</text><text x="355" y="468">28</text><text x="423" y="468">29</text><text x="491" y="468">30</text><text x="559" y="468">31</text></g>
  <circle class="primary" cx="292" cy="414" r="20"/><text class="w" x="283" y="419">20</text><circle class="primary" cx="496" cy="462" r="20"/><text class="w" x="487" y="467">30</text><circle class="disabled" cx="156" cy="462" r="20"/><text class="t" x="147" y="467">25</text>
  <rect class="accent" x="665" y="305" width="415" height="185" rx="12"/><text class="h" x="690" y="340">Ketentuan tanggal</text><text class="t" x="690" y="376">• Tanggal dapat dipilih secara acak.</text><text class="t" x="690" y="408">• Setiap tanggal menjadi pengajuan terpisah.</text><text class="t" x="690" y="440">• Minggu dan hari libur tidak dapat dipilih.</text><circle class="primary" cx="690" cy="467" r="6"/><text class="s" x="705" y="472">Dipilih</text><circle class="disabled" cx="785" cy="467" r="6"/><text class="s" x="800" y="472">Tidak tersedia</text>
  <text class="h" x="120" y="594">Alasan cuti *</text><rect class="surface" x="120" y="610" width="960" height="60" rx="10"/><text class="s" x="140" y="643">Jelaskan alasan pengajuan cuti</text><rect class="surface" x="868" y="682" width="90" height="42" rx="9"/><text class="t" x="894" y="708">Batal</text><rect class="primary" x="970" y="682" width="145" height="42" rx="9"/><text class="w" x="989" y="708">Kirim Pengajuan</text>
