<title id="title">Wireframe dashboard Admin HR</title><desc id="description">Dashboard Admin HR berisi status sistem, sambutan, tombol pengelolaan karyawan, dan ringkasan bagian organisasi, Staff, serta Atasan.</desc><defs><style>.b{fill:#f8fafc}.f{fill:#fff;stroke:#64748b;stroke-width:2}.s{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.m{fill:#e2e8f0;stroke:#94a3b8;stroke-width:1.5}.a{fill:#d1fae5;stroke:#059669;stroke-width:2}.p{fill:#059669}.h{fill:#0f172a;font:700 18px Arial}.t{fill:#334155;font:14px Arial}.x{fill:#64748b;font:12px Arial}.n{fill:#047857;font:700 13px Arial}.w{fill:#fff;font:700 14px Arial}</style></defs>
