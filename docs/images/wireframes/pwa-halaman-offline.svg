<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Wireframe halaman offline</title>
  <desc id="description">Halaman offline responsif yang menjelaskan kebutuhan koneksi internet dan menyediakan tombol coba lagi tanpa menampilkan data pribadi.</desc>
  <defs>
    <style>
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .surface { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .muted { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.5; }
      .accent { fill: #d1fae5; stroke: #059669; stroke-width: 2; }
      .primary { fill: #059669; }
      .line { fill: none; stroke: #64748b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .heading { fill: #0f172a; font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; }
      .title { fill: #0f172a; font-family: Arial, sans-serif; font-size: 23px; font-weight: 700; }
      .text { fill: #334155; font-family: Arial, sans-serif; font-size: 14px; }
      .small { fill: #64748b; font-family: Arial, sans-serif; font-size: 12px; }
      .note { fill: #047857; font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; }
      .white { fill: #ffffff; font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; }
    </style>
  </defs>

  <rect class="canvas" width="1200" height="700"/>
  <text class="heading" x="50" y="54">UI-PWA-01 — Halaman Offline</text>
  <text class="small" x="50" y="80">Halaman aman tanpa data pribadi atau fasilitas penyimpanan transaksi.</text>

  <text class="heading" x="80" y="125">Desktop</text>
  <rect class="frame" x="80" y="145" width="680" height="500" rx="16"/>
  <rect class="muted" x="80" y="145" width="680" height="68" rx="16"/>
  <rect class="primary" x="105" y="160" width="40" height="40" rx="9"/>
  <text class="white" x="116" y="185">MA</text>
  <text class="text" x="158" y="177">Medika Cuti</text>
  <text class="small" x="158" y="196">Klinik Utama Medika Antapani</text>

  <circle class="accent" cx="420" cy="315" r="55"/>
  <path class="line" d="M385 319c18-21 52-21 70 0M397 332c12-13 34-13 46 0M414 346h12M381 290l78 78"/>
  <text class="title" x="327" y="404">Tidak Ada Koneksi</text>
  <text class="text" x="245" y="440">Aplikasi memerlukan internet untuk memuat data,</text>
  <text class="text" x="241" y="464">mengirim pengajuan, dan memberikan keputusan.</text>
  <rect class="primary" x="330" y="500" width="180" height="48" rx="10"/>
  <text class="white" x="386" y="529">Coba Lagi</text>
  <text class="small" x="250" y="590">Tidak ada data pribadi yang ditampilkan dari cache.</text>

  <text class="heading" x="840" y="125">Ponsel</text>
  <rect class="frame" x="840" y="145" width="280" height="500" rx="24"/>
  <rect class="muted" x="840" y="145" width="280" height="64" rx="24"/>
  <rect class="primary" x="860" y="158" width="38" height="38" rx="9"/>
  <text class="white" x="870" y="182">MA</text>
  <text class="text" x="910" y="176">Medika Cuti</text>
  <text class="small" x="910" y="194">Klinik Utama Medika Antapani</text>
  <circle class="accent" cx="980" cy="315" r="48"/>
  <path class="line" d="M950 318c15-18 45-18 60 0M961 331c10-11 28-11 38 0M975 344h10M946 293l68 68"/>
  <text class="heading" x="899" y="401">Tidak Ada Koneksi</text>
  <text class="text" x="875" y="438">Koneksi internet diperlukan</text>
  <text class="text" x="886" y="461">untuk melanjutkan proses.</text>
  <rect class="primary" x="875" y="495" width="210" height="48" rx="10"/>
  <text class="white" x="946" y="524">Coba Lagi</text>
  <rect class="surface" x="875" y="565" width="210" height="45" rx="9"/>
  <text class="small" x="894" y="592">Transaksi tidak tersedia</text>
</svg>
