<title id="title">Wireframe master karyawan</title><desc id="description">Pengelolaan karyawan dengan pencarian, filter peran, pengelompokan berdasarkan bagian organisasi, detail modal, dan formulir tambah atau ubah.</desc><defs><style>.b{fill:#f8fafc}.f{fill:#fff;stroke:#64748b;stroke-width:2}.s{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.m{fill:#e2e8f0;stroke:#94a3b8;stroke-width:1.5}.a{fill:#d1fae5;stroke:#059669;stroke-width:2}.p{fill:#059669}.h{fill:#0f172a;font:700 18px Arial}.t{fill:#334155;font:14px Arial}.x{fill:#64748b;font:12px Arial}.n{fill:#047857;font:700 13px Arial}.w{fill:#fff;font:700 14px Arial}</style></defs><rect class="b" width="1200" height="720"/><text class="h" x="50" y="54">UI-HR-04 — Master Karyawan</text><text class="x" x="50" y="80">Daftar dikelompokkan berdasarkan bagian organisasi; detail dibuka sebagai dialog.</text><rect class="f" x="50" y="110" width="1100" height="560" rx="16"/><text class="n" x="80" y="150">KLINIK UTAMA MEDIKA ANTAPANI</text><text class="h" x="80" y="184">Master Karyawan</text><rect class="p" x="975" y="144" width="145" height="42" rx="9"/><text class="w" x="994" y="170">Tambah Karyawan</text>
