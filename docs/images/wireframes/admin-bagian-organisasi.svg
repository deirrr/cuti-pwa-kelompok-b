<title id="title">Wireframe bagian organisasi</title><desc id="description">Daftar bagian organisasi dengan pencarian, status, jumlah pegawai, tindakan ubah, dan formulir informasi struktur.</desc><defs><style>.b{fill:#f8fafc}.f{fill:#fff;stroke:#64748b;stroke-width:2}.s{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.m{fill:#e2e8f0;stroke:#94a3b8;stroke-width:1.5}.a{fill:#d1fae5;stroke:#059669;stroke-width:2}.p{fill:#059669}.h{fill:#0f172a;font:700 18px Arial}.t{fill:#334155;font:14px Arial}.x{fill:#64748b;font:12px Arial}.n{fill:#047857;font:700 13px Arial}.w{fill:#fff;font:700 14px Arial}</style></defs><rect class="b" width="1200" height="650"/><text class="h" x="50" y="54">UI-HR-04 — Bagian Organisasi</text><text class="x" x="50" y="80">Struktur organisasi dikelola sebagai data dasar penempatan karyawan.</text><rect class="f" x="50" y="110" width="1100" height="490" rx="16"/><text class="n" x="80" y="150">KLINIK UTAMA MEDIKA ANTAPANI</text><text class="h" x="80" y="184">Bagian Organisasi</text><rect class="p" x="982" y="144" width="138" height="42" rx="9"/><text class="w" x="1003" y="170">Tambah Bagian</text><rect class="s" x="80" y="220" width="650" height="325" rx="13"/><text class="h" x="105" y="258">Daftar Bagian</text><rect class="m" x="430" y="238" width="190" height="40" rx="8"/><text class="x" x="448" y="263">Cari nama atau kode</text><rect class="p" x="630" y="238" width="75" height="40" rx="8"/><text class="w" x="646" y="263">Cari</text><rect class="m" x="80" y="295" width="650" height="45"/><text class="x" x="105" y="323">KODE</text><text class="x" x="220" y="323">NAMA BAGIAN</text><text class="x" x="455" y="323">PEGAWAI</text><text class="x" x="570" y="323">STATUS</text><text class="x" x="670" y="323">AKSI</text><text class="t" x="105" y="375">PLM</text><text class="t" x="220" y="375">Pelayanan Medis</text><text class="t" x="455" y="375">12</text><rect class="a" x="555" y="353" width="78" height="32" rx="16"/><text class="n" x="574" y="374">Aktif</text><t